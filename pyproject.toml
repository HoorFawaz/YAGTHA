[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yagtha"
version = "0.1.0"
description = "Tests how robust Sigma detection rules are against attacker variations and proposes verified improvements."
readme = "README.md"
license = "MIT"
authors = [{ name = "Hoor Fawaz" }]
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0.2,<7",
    "regex>=2024.11.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0.12",
    "types-regex>=2024.11.6",
    "bandit>=1.8",
    "pip-audit>=2.7",
]
llm = ["anthropic>=2.2,<3"]
ui = ["streamlit>=1.65,<2"]

[project.scripts]
yagtha = "yagtha.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"examples/*/test_*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*", "streamlit", "streamlit.*"]
ignore_missing_imports = true
