title: Whoami Discovery from a Script Shell
id: 5e1a9c37-2d8b-4f60-9a3e-6c7b1d4e2f08
status: experimental
description: >
  Detects whoami with the /all switch. Runs started from Explorer are filtered
  out because admins often type it by hand.
author: Hoor Fawaz
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\whoami.exe'
    CommandLine|contains: '/all'
  filter_explorer:
    ParentImage|endswith: '\explorer.exe'
  condition: selection and not filter_explorer
level: medium
